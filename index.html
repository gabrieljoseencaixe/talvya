<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alvyna · Gestão inteligente para quem atende</title>
<meta name="theme-color" content="#0b1f3b">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f7;--card:#fff;--ink:#14213a;--mut:#5b6577;--gold:#d4af7c;--gold2:#8a6a35;--hd:#0b1f3b;--on:#0b1f3b;--navy:#0b1f3b;--line:#e3e0d8;--ok:#2f7a55;--bad:#b04a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07111f;--card:#0d213f;--ink:#f7f7f7;--mut:#a9b3c4;--line:#1f3759;--gold:#d4af7c;--gold2:#e6c999;--hd:#e6c999;--on:#0b1f3b;--ok:#7fd1a2;--bad:#f0937f}}
:root[data-theme="dark"]{--bg:#07111f;--card:#0d213f;--ink:#f7f7f7;--mut:#a9b3c4;--line:#1f3759;--gold:#d4af7c;--gold2:#e6c999;--hd:#e6c999;--on:#0b1f3b;--ok:#7fd1a2;--bad:#f0937f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Jost,system-ui,sans-serif}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0;color:var(--hd)}
h2{font-size:1.5rem;text-transform:capitalize}h3{font-size:1.2rem;margin:18px 0 8px}
header{text-align:center;padding:26px 16px 8px}
.gf{font:600 2.6rem/1 "Cormorant Garamond",Georgia,serif;color:var(--gold)}
.gf sup{font-size:.9rem}
header h1{font-size:1.25rem;letter-spacing:.28em;margin-top:6px}
header p{margin:2px 0 0;font:italic 500 1rem "Cormorant Garamond",Georgia,serif;color:var(--mut)}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;justify-content:center}
.tab,.btn,.chip,.ghost{font:500 14px Jost,system-ui,sans-serif;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab{border:1px solid var(--gold);background:transparent;color:var(--gold2);padding:8px 18px}
.tab.on,.btn,.chip.on{background:var(--gold);color:var(--on);border:1px solid var(--gold)}
.btn{padding:10px 26px;margin-top:12px}.btn:hover,.tab:hover{filter:brightness(1.07)}
.ghost{background:none;border:1px solid var(--line);color:var(--gold2);padding:4px 12px}
.chip{background:transparent;border:1px solid var(--line);color:var(--ink);padding:6px 14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:980px;margin:0 auto;padding:0 16px 40px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:grid;gap:4px;color:var(--mut);font-size:13px}
input,select{font:15px Jost,system-ui,sans-serif;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.wk,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wk span{color:var(--mut);font-size:12px}
.day{position:relative;aspect-ratio:1;border:1px solid transparent;border-radius:50%;background:none;color:var(--ink);font:15px Jost,sans-serif;cursor:pointer}
.day:hover{border-color:var(--gold)}.day.today{border-color:var(--gold2)}
.day.sel{background:var(--gold);color:var(--on);font-weight:500}
.day b{position:absolute;right:2px;top:2px;min-width:16px;height:16px;border-radius:8px;background:var(--navy);color:var(--gold);font-size:10px;line-height:16px}
.item{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.item small,.mut{color:var(--mut)}
.tot{font:600 1.3rem "Cormorant Garamond",Georgia,serif;color:var(--gold2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.kpi{border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.kpi span{font-size:12px;color:var(--mut)}.kpi div{font:600 1.5rem "Cormorant Garamond",Georgia,serif}
.in{color:var(--ok)}.out{color:var(--bad)}
.tag{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--gold);color:var(--gold2)}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.rm{background:none;border:0;color:var(--bad);cursor:pointer;font-size:13px}
.scroll{overflow-x:auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--navy);color:var(--gold);border:1px solid var(--gold);padding:10px 20px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.app{display:grid;grid-template-columns:260px 1fr;min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;background:var(--card);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:12px}.brand .gf{font-size:2.2rem}
.brand b{display:block;font:600 1.05rem "Cormorant Garamond",Georgia,serif;letter-spacing:.16em;color:var(--gold2)}
.brand small,.slogan{color:var(--mut);font-size:13px}
.slogan{margin:auto 0 0;font:italic 500 1rem "Cormorant Garamond",Georgia,serif;text-align:center}
.side #tabs{flex-direction:column;justify-content:flex-start;overflow:visible;padding:0;gap:4px}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;border:0;border-radius:999px;background:none;color:var(--ink);font:500 15px Jost,system-ui,sans-serif;cursor:pointer;text-align:left}
.nv:hover{background:var(--bg)}.nv.on{background:var(--gold);color:var(--on)}
.nv svg,.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn svg{width:16px;height:16px;vertical-align:-3px;margin-right:6px;stroke-width:2}
.app main{max-width:1100px;width:100%;margin:0;padding:26px 28px 48px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.ph .btn{margin:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.dh{font-size:1.15rem;margin:18px 0 0;cursor:pointer;text-transform:capitalize}.dh.cur{color:var(--gold2);border-left:3px solid var(--gold);padding-left:8px}
@media(max-width:820px){
.app{grid-template-columns:1fr;padding-bottom:76px}
.side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5;border-right:0;border-top:1px solid var(--line)}
.brand,.slogan,.side>.btn,#st{display:none}
.side #tabs{flex-direction:row;width:100%;justify-content:space-around;gap:2px}
.nv{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;border-radius:16px;justify-content:center;align-items:center;text-align:center}
.app main{padding:16px 14px 24px}.two{grid-template-columns:1fr}
#toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}}
#login{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding:20px}#login[hidden]{display:none}
.item.ag{cursor:pointer;border-radius:12px;padding-left:8px;padding-right:8px}.item.ag:hover,.item.ag:focus-visible{background:var(--bg)}#modal{position:fixed;inset:0;z-index:15;background:rgba(5,12,24,.62);display:grid;place-items:center;padding:16px}#modal[hidden]{display:none}#md{width:min(460px,100%);max-height:90dvh;overflow:auto}

/* ---------- Identidade Alvyna ---------- */
.btn,.chip,.ghost,.tab,.nv,input,select,#toast{border-radius:10px}.tag{border-radius:6px}.card{border-radius:14px}.kpi{border-radius:12px;border-left:3px solid var(--gold)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.side{background:linear-gradient(180deg,#0b1f3b,#07152a);border-right:1px solid rgba(212,175,124,.28);color:#f7f7f7}
.side .nv{color:#e9edf5}.side .nv:hover{background:rgba(212,175,124,.14)}.side .nv.on{background:var(--gold);color:#0b1f3b}
.side :focus-visible{outline-color:#d4af7c}
.side small{color:#b9c2d3}
.brand{justify-content:center;padding:6px 0 14px;border-bottom:1px solid rgba(212,175,124,.28)}
.logo{display:block;width:100%;max-width:190px;height:auto}
.side .slogan{color:var(--gold);font-size:1.05rem;line-height:1.5;padding-top:14px;border-top:1px solid rgba(212,175,124,.28)}
.mtop{display:none}
@media(max-width:820px){.mtop{display:flex;justify-content:center;padding:12px 0;background:#0b1f3b;border-bottom:1px solid rgba(212,175,124,.35)}.mtop img{height:46px;width:auto}.side{border-top:1px solid rgba(212,175,124,.35)}.side .nv{color:#e9edf5}.side .nv.on{color:#0b1f3b}}
#login{background:radial-gradient(ellipse at top,#12305a,#07152a 72%)}
#login .card{background:rgba(11,31,59,.88);border-color:rgba(212,175,124,.4);color:#f7f7f7}
#login label{color:#b9c2d3}#login input{background:#07152a;color:#f7f7f7;border-color:#2a4570}
#login .out{color:#f0937f}#login :focus-visible{outline-color:#d4af7c}
textarea{font:15px Jost,system-ui,sans-serif;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%;resize:vertical;box-sizing:border-box}
input[type=color]{height:42px;padding:3px;cursor:pointer}input[type=file]{padding:7px}
.lg{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:16px}@media(max-width:900px){.lg{grid-template-columns:1fr}}
.rc{display:grid;justify-items:center;gap:14px;text-align:center}
.rav{width:96px;height:96px;border-radius:50%;overflow:hidden;background:#0b1f3b;display:grid;place-items:center;border:2px solid var(--gold)}.rav img{width:100%;height:100%;object-fit:cover}.rav img.mk{width:72%;height:auto;object-fit:contain}
.rnm{font-size:1.6rem;margin:0;color:var(--hd)}
.rmsg{width:100%;box-sizing:border-box;background:var(--bg);border-radius:16px;padding:18px 20px;line-height:1.6;color:var(--ink);overflow-wrap:anywhere}
.rb1,.rb2{display:block;width:min(100%,320px);box-sizing:border-box;padding:13px 16px;border-radius:999px;text-align:center;text-decoration:none;font-weight:500}
.rb1{color:#0a0a0a}.rb2{border:1px solid var(--ink);color:var(--ink)}
.rb1:focus-visible,.rb2:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
@media(max-width:820px){.side #tabs{gap:0}.side .nv{flex:1 1 0;min-width:0;font-size:10px;padding:6px 1px;letter-spacing:0}.side .nv span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.side .nv svg{width:20px;height:20px}}
@media(min-width:821px){.side{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(212,175,124,.4) transparent}.side .slogan{flex-shrink:0}}
@media(min-width:821px) and (max-height:820px){.side{padding:16px 14px;gap:12px}.logo{max-width:150px}.brand{padding:2px 0 10px}.side .nv{padding:8px 12px}.side .slogan{padding-top:10px;font-size:.95rem}}
@media(min-width:821px) and (max-height:640px){.logo{max-width:112px}.side .slogan{display:none}}
:root{--c1:#0b1f3b}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#8fb4ee}}:root[data-theme="dark"]{--c1:#8fb4ee}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.cht{display:flex;align-items:flex-end;gap:12px;height:170px}.cht .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.cht .pair{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:136px;width:100%}.cht .pair i{width:38%;max-width:28px;min-height:2px;border-radius:6px 6px 0 0}
.rcb{background:var(--c1)}.dsb{background:var(--gold)}.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px}
.c2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.c2{grid-template-columns:1fr}}
@media(max-width:820px){.side #tabs{overflow-x:auto;scrollbar-width:none}.side .nv{flex:0 0 auto;min-width:62px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><img class="logo" data-logo alt="Alvyna · Gestão inteligente para quem atende"></div>
  <button class="btn" style="margin:0" onclick="novo()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Novo agendamento</button>
  <nav id="tabs" aria-label="Menu principal"></nav>
  <p class="slogan">Mais organização.<br>Mais tempo.<br>Uma experiência melhor.</p>
  <small id="st" class="mut" style="text-align:center"></small>
</aside>
<div class="mtop"><img data-mark alt="Alvyna"></div>
<main id="main"></main>
</div>
<div id="login" hidden><section class="card" style="width:min(380px,100%);text-align:center"><img class="logo" data-logo alt="Alvyna · Gestão inteligente para quem atende" style="max-width:230px;margin:0 auto 22px">
<div class="grid" style="grid-template-columns:1fr;text-align:left"><label>E-mail<input id="le" type="email" autocomplete="username"></label><label>Senha<input id="ls" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')entrar()"></label></div>
<button class="btn" onclick="entrar()">Entrar</button><p id="lm" class="out" role="alert"></p></section></div>
<div id="modal" hidden onclick="if(event.target===this)fechar()"><section class="card" id="md" role="dialog" aria-modal="true"></section></div>
<div id="toast" role="status"></div>

const limpa=s=>String(s??'').replace(/[{}\[\]<>]/g,'').replace(/\s+/g,' ').trim().slice(0,120);
const capW=w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
const primeiroNome=n=>{const w=limpa(n).split(' ')[0];return /^[^A-Z]*$|^[^a-z]*$/.test(w)?capW(w):w};
const foneDig=t=>{let d=String(t||'').replace(/\D/g,'').replace(/^0+/,'');if(d.length&&d.length<=11)d='55'+d;return d};
const waLink=t=>{const d=foneDig(t);return d.length>=12&&d.length<=13?'https://wa.me/'+d:''};
const fmtData=(iso,f)=>{const[y,m,d]=iso.split('-');return f==='dd/MM'?`${d}/${m}`:`${d}/${m}/${y}`};
const FALL={procedimento:'seu atendimento'};
function renderTpl(tpl,vars){
  let s=String(tpl||'').replace(/\[\[([\s\S]*?)\]\]/g,(_,b)=>{let ok=true;const r=b.replace(/\{\{(\w+)\}\}/g,(_,k)=>{const x=vars[k]||'';if(!x)ok=false;return x});return ok?r:''});
  s=s.replace(/\{\{(\w+)\}\}/g,(_,k)=>k in vars?(vars[k]||FALL[k]||''):'');
  return s.replace(/\s+([,.!?;:])/g,'$1').replace(/,\s*([!.?])/g,'$1').replace(/[ \t]{2,}/g,' ').trim()}
function montarMsg(c,v,hora){

  const titulo=renderTpl(c.titulo,vars),corpo=renderTpl(c.corpo,vars);
  let texto=(titulo+' '+corpo).trim();
  if(c.saudacao_horario)texto=texto.replace(/^Olá/,hora<12?'Bom dia':hora<18?'Boa tarde':'Boa noite');

function mes(k){const pk=S.ag.flatMap(g=>g.parcelas).filter(p=>p.data.startsWith(k));
 return{rec:tot(pk.filter(p=>p.pago),p=>p.valor),pen:tot(pk.filter(p=>!p.pago),p=>p.valor),sai:tot(S.desp.filter(x=>x.data.startsWith(k)),x=>x.valor),ag:S.ag.filter(g=>g.data.startsWith(k))}}

 serie=[5,4,3,2,1,0].map(i=>{const d=new Date(dm.getFullYear(),dm.getMonth()-i,1);return{l:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),...mes(ymK(d))}}),mx=Math.max(...serie.flatMap(s=>[s.rec,s.sai]),1);

function vCaixa(){
  const[a,b]=range(per,ref),ent=[];
  S.ag.forEach(g=>g.parcelas.forEach(p=>ent.push({t:'in',data:p.data,d:`${g.pacNome} · ${g.procNome}${g.parcelas.length>1?` (${p.n}/${g.parcelas.length})`:''}`,v:p.valor,pago:p.pago,g:g.id,n:p.n})));
  S.desp.forEach(x=>ent.push({t:'out',data:x.data,d:x.desc,v:x.valor,pago:true,x:x.id}));
  const L=ent.filter(e=>e.data>=a&&e.data<=b).sort((p,q)=>p.data.localeCompare(q.data));
  const rec=sum(L.filter(e=>e.t=='in'&&e.pago)),pen=sum(L.filter(e=>e.t=='in'&&!e.pago)),sai=sum(L.filter(e=>e.t=='out'));
  return ph('Fluxo de caixa',"tg('desp')",'Lançar despesa')+(op.desp?`<section class="card" id="frm"><h3 style="margin-top:0">Lançar despesa</h3><div class="grid"><label>Descrição<input id="dd" placeholder="Ex.: aluguel, produtos, luz"></label><label>Valor (R$)<input id="dv" data-money inputmode="numeric" placeholder="0,00"></label><label>Data<input id="dt" type="date" value="${ref}"></label></div><button class="btn" onclick="addDesp()">Lançar despesa</button></section>`:'')+`<section class="card"><h3 style="margin-top:0">Resumo do período</h3>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0">${PERS.map(([k,l])=>`<button class="chip ${per==k?'on':''}" onclick="per='${k}';render()">${l}</button>`).join('')}</div>
  <label style="max-width:200px">Data de referência<input type="date" value="${ref}" onchange="ref=this.value||ref;render()"></label>
  <p class="mut">Período: ${fmt(a)} a ${fmt(b)}</p>
  <div class="kpis"><div class="kpi"><span>Entradas recebidas</span><div class="in">${brl(rec)}</div></div><div class="kpi"><span>A receber (parcelas)</span><div>${brl(pen)}</div></div><div class="kpi"><span>Saídas / despesas</span><div class="out">${brl(sai)}</div></div><div class="kpi"><span>Atendimentos sem pagamento</span><div>${S.ag.filter(g=>!g.forma&&g.data>=a&&g.data<=b).length}</div></div><div class="kpi"><span>Saldo do período</span><div>${brl(rec-sai)}</div></div><div class="kpi"><span>Saldo previsto</span><div>${brl(rec+pen-sai)}</div></div></div>
  <div class="scroll">${L.length?L.map(e=>`<div class="item"><div><strong>${esc(e.d)}</strong><br><small>${fmt(e.data)}</small></div><div style="text-align:right"><span class="${e.t}"> ${e.t=='in'?'+':'−'}${brl(e.v)}</span><br>${e.t=='out'?`<button class="rm" onclick="delDesp('${e.x}')">Remover</button>`:e.pago?'<span class="tag ok">Recebido</span>':`<span class="tag">Pendente</span> <button class="rm" style="color:var(--gold2)" onclick="baixa('${e.g}',${e.n})">Marcar recebido</button>`}</div></div>`).join(''):'<p class="mut">Sem movimentações neste período.</p>'}</div></section>`}
function addDesp(){const desc=$('#dd').value.trim(),v=moeda($('#dv').value);if(!desc||!(v>0))return toast('Informe descrição e valor');
  const o={id:uid(),desc,valor:v,data:$('#dt').value||ref};S.desp.push(o);put('desp',o);op.desp=0;render();toast('Despesa lançada')}
function delDesp(id){S.desp=S.desp.filter(x=>x.id!=id);del('desp',id);render()}
